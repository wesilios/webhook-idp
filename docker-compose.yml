# Local stack for the Webhook Platform.
#
#   yarn docker:up      # build + start everything (infra + apps) in the background
#   yarn infra:up       # only MongoDB + RabbitMQ — for running the apps on the host with `yarn dev`
#
# Host ports are chosen to match each package's `.env.example`, so `yarn dev` and this stack are interchangeable.
# This is a local/dev stack only — deployments build each package's Dockerfile on its own (see
# .agent/rules/deployment.md).

name: webhook-platform

# `development` keeps Swagger UI enabled (both HTTP apps only mount it outside production).
x-app-env: &app-env
  NODE_ENV: development
  VERSION: '1.0.0'

services:
  # ---------- infrastructure ----------
  mongodb:
    # Pinned to 7: MongoDB 8 refuses to start on Linux kernels >= 6.19 (SERVER-121912), which includes Docker
    # Desktop's VM kernel.
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    # The official image allows the default guest/guest user from non-loopback clients, so
    # amqp://localhost:5672 works from the host and amqp://rabbitmq:5672 from other containers.
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI — http://localhost:15672 (guest / guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 20

  # ---------- apps ----------
  webhook-api:
    build:
      context: .
      dockerfile: packages/webhook-api/Dockerfile
    environment:
      <<: *app-env
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/webhook
    ports:
      - '4321:3000'
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  event-ingestion-worker:
    build:
      context: .
      dockerfile: packages/event-ingestion-worker/Dockerfile
    environment:
      <<: *app-env
      MONGODB_URI: mongodb://mongodb:27017/webhook
      RABBIT_MQ_CONN: amqp://rabbitmq:5672
      RABBIT_MQ_QUEUE: webhook.events
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  idp:
    build:
      context: .
      dockerfile: packages/idp/Dockerfile
    environment:
      <<: *app-env
      PORT: 3000
      RABBIT_MQ_CONN: amqp://rabbitmq:5672
      RABBIT_MQ_QUEUE: webhook.events
      APPLICATION_ID: 7b656e3f-3434-461d-9b65-48935e0efedb
      APPLICATION_NAME: SandboxService
    ports:
      - '4322:3000'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb-data:
  rabbitmq-data:
